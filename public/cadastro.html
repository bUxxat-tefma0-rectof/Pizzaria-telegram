<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Cadastro - Pizzaria</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--tg-theme-bg-color, #1a1a2e);
            color: var(--tg-theme-text-color, #eee);
            padding: 16px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        
        .logo {
            text-align: center;
            font-size: 48px;
            margin-bottom: 8px;
        }
        
        h1 {
            text-align: center;
            font-size: 22px;
            margin-bottom: 4px;
            color: var(--tg-theme-text-color, #fff);
        }
        
        .sub {
            text-align: center;
            font-size: 13px;
            color: var(--tg-theme-hint-color, #999);
            margin-bottom: 24px;
        }
        
        .form-group {
            margin-bottom: 16px;
        }
        
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--tg-theme-text-color, #ddd);
        }
        
        label .required {
            color: #e74c3c;
        }
        
        input, select {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid var(--tg-theme-hint-color, #444);
            border-radius: 12px;
            font-size: 16px;
            background: var(--tg-theme-secondary-bg-color, #16213e);
            color: var(--tg-theme-text-color, #fff);
            transition: all 0.3s;
            outline: none;
            font-family: inherit;
        }
        
        input:focus, select:focus {
            border-color: #e74c3c;
            box-shadow: 0 0 0 3px rgba(231, 76, 60, 0.2);
        }
        
        input.error {
            border-color: #e74c3c;
            animation: shake 0.5s;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }
        
        .error-msg {
            color: #e74c3c;
            font-size: 12px;
            margin-top: 4px;
            display: none;
        }
        
        .error-msg.show {
            display: block;
        }
        
        .row {
            display: flex;
            gap: 12px;
        }
        
        .row .form-group {
            flex: 1;
        }
        
        .btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            transition: all 0.3s;
            font-family: inherit;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(231, 76, 60, 0.4);
        }
        
        .btn:active {
            transform: scale(0.98);
        }
        
        .btn:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .success {
            text-align: center;
            padding: 40px 20px;
        }
        
        .success .icon {
            font-size: 80px;
            animation: bounce 0.6s;
        }
        
        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3); }
        }
        
        .success h2 {
            color: #2ecc71;
            margin: 16px 0 8px;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #333;
            border-top: 4px solid #e74c3c;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 12px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🍕</div>
        <h1>Pizzaria Telegram</h1>
        <p class="sub">Preencha seus dados para se cadastrar</p>
        
        <form id="formCadastro">
            <div class="form-group">
                <label><span class="required">*</span> Nome completo</label>
                <input type="text" id="nome" placeholder="João Silva" required autocomplete="name">
                <span class="error-msg" id="nomeError">Digite nome e sobrenome</span>
            </div>
            
            <div class="form-group">
                <label><span class="required">*</span> Email</label>
                <input type="email" id="email" placeholder="joao@email.com" required autocomplete="email">
                <span class="error-msg" id="emailError">Email inválido</span>
            </div>
            
            <div class="form-group">
                <label><span class="required">*</span> Telefone com DDD</label>
                <input type="tel" id="telefone" placeholder="44999525600" required autocomplete="tel">
                <span class="error-msg" id="telError">Digite DDD + número</span>
            </div>
            
            <div class="form-group">
                <label>CEP (opcional)</label>
                <div class="row">
                    <input type="text" id="cep" placeholder="87700000" maxlength="8" style="flex:2">
                    <button type="button" onclick="buscarCEP()" style="flex:1; padding:14px; background:#555; color:white; border:none; border-radius:12px; cursor:pointer; font-size:14px;">🔍 Buscar</button>
                </div>
            </div>
            
            <div class="form-group">
                <label>Rua</label>
                <input type="text" id="rua" placeholder="Rua Principal" autocomplete="street-address">
            </div>
            
            <div class="row">
                <div class="form-group">
                    <label>Número</label>
                    <input type="text" id="numero" placeholder="100">
                </div>
                <div class="form-group">
                    <label>Bairro</label>
                    <input type="text" id="bairro" placeholder="Centro">
                </div>
            </div>
            
            <div class="row">
                <div class="form-group">
                    <label>Cidade</label>
                    <input type="text" id="cidade" placeholder="Paranavaí">
                </div>
                <div class="form-group">
                    <label>Estado</label>
                    <select id="estado">
                        <option value="">Selecione</option>
                        <option value="PR">PR</option><option value="SP">SP</option><option value="RJ">RJ</option>
                        <option value="MG">MG</option><option value="RS">RS</option><option value="SC">SC</option>
                        <option value="BA">BA</option><option value="PE">PE</option><option value="CE">CE</option>
                        <option value="DF">DF</option><option value="GO">GO</option><option value="MT">MT</option>
                        <option value="MS">MS</option><option value="AM">AM</option><option value="PA">PA</option>
                    </select>
                </div>
            </div>
            
            <button type="submit" class="btn" id="btnCadastrar">✅ Finalizar Cadastro</button>
        </form>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Salvando seus dados...</p>
        </div>
        
        <div class="success" id="success" style="display:none">
            <div class="icon">🎉</div>
            <h2>Cadastro Concluído!</h2>
            <p>Seus dados foram salvos com sucesso.</p>
            <p style="margin-top:12px; color:#999;">Feche esta janela e volte para o bot.</p>
        </div>
    </div>
    
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();
        
        // Pega o ID do usuário do Telegram
        const userId = tg.initDataUnsafe?.user?.id;
        
        async function buscarCEP() {
            const cep = document.getElementById('cep').value.replace(/\D/g, '');
            if (cep.length !== 8) return alert('Digite um CEP válido com 8 dígitos');
            
            try {
                const resp = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
                const data = await resp.json();
                
                if (data.erro) return alert('CEP não encontrado');
                
                document.getElementById('rua').value = data.logradouro || '';
                document.getElementById('bairro').value = data.bairro || '';
                document.getElementById('cidade').value = data.localidade || '';
                document.getElementById('estado').value = data.uf || '';
            } catch (e) {
                alert('Erro ao buscar CEP');
            }
        }
        
        document.getElementById('formCadastro').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Reset erros
            document.querySelectorAll('.error-msg').forEach(el => el.classList.remove('show'));
            document.querySelectorAll('input').forEach(el => el.classList.remove('error'));
            
            let hasError = false;
            
            // Valida nome
            const nome = document.getElementById('nome').value.trim();
            if (nome.length < 3 || nome.split(' ').filter(p => p.length > 0).length < 2) {
                document.getElementById('nome').classList.add('error');
                document.getElementById('nomeError').classList.add('show');
                hasError = true;
            }
            
            // Valida email
            const email = document.getElementById('email').value.trim();
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                document.getElementById('email').classList.add('error');
                document.getElementById('emailError').classList.add('show');
                hasError = true;
            }
            
            // Valida telefone
            const telefone = document.getElementById('telefone').value.replace(/\D/g, '');
            if (telefone.length < 10 || telefone.length > 11) {
                document.getElementById('telefone').classList.add('error');
                document.getElementById('telError').classList.add('show');
                hasError = true;
            }
            
            if (hasError) return;
            
            // Monta dados
            const dados = {
                userId: userId,
                nome: nome,
                email: email,
                telefone: telefone,
                cep: document.getElementById('cep').value.replace(/\D/g, ''),
                rua: document.getElementById('rua').value.trim(),
                numero: document.getElementById('numero').value.trim(),
                bairro: document.getElementById('bairro').value.trim(),
                cidade: document.getElementById('cidade').value.trim(),
                estado: document.getElementById('estado').value
            };
            
            // Mostra loading
            document.getElementById('formCadastro').style.display = 'none';
            document.getElementById('loading').style.display = 'block';
            document.getElementById('btnCadastrar').disabled = true;
            
            // Envia pro backend
            try {
                const resp = await fetch('/api/cadastro-webapp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dados)
                });
                
                const result = await resp.json();
                
                document.getElementById('loading').style.display = 'none';
                
                if (result.sucesso) {
                    document.getElementById('success').style.display = 'block';
                    setTimeout(() => tg.close(), 2000);
                } else {
                    alert(result.mensagem || 'Erro ao cadastrar');
                    document.getElementById('formCadastro').style.display = 'block';
                    document.getElementById('btnCadastrar').disabled = false;
                }
            } catch (err) {
                document.getElementById('loading').style.display = 'none';
                alert('Erro de conexão. Tente novamente.');
                document.getElementById('formCadastro').style.display = 'block';
                document.getElementById('btnCadastrar').disabled = false;
            }
        });
    </script>
</body>
</html>
